services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      # Persist ChromaDB data across restarts
      - chroma_data:/app/chroma_data
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_data
    restart: unless-stopped

volumes:
  chroma_data:
