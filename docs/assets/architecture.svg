<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1076" viewBox="0 0 1560 1076" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c8d2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38a36f"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f71cf"/></marker></defs><rect width="1560" height="1076" fill="#fbfbfd"/><text x="44" y="50" font-size="27" font-weight="700" fill="#14161a">Sensei — a project teammate that works unprompted</text><text x="44" y="78" text-anchor="start" font-size="14" font-weight="400" fill="#5f6570">Strands Agents SDK.   Pink = the agent acting on its own initiative.   Dashed = next.</text><text x="44" y="118" text-anchor="start" font-size="12" font-weight="700" fill="#5f6570">1 — WHAT SETS IT OFF</text><rect x="44" y="130" width="372" height="86" rx="10" fill="#eef2ff" stroke="#7c8ff5" stroke-width="1.6"/><text x="230.0" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">A person asks</text><text x="230.0" y="176" text-anchor="middle" font-size="12.5" fill="#5f6570">chat, streamed with its tool calls narrated</text><rect x="404" y="130" width="372" height="86" rx="10" fill="#fdeef2" stroke="#d9537a" stroke-width="1.6"/><text x="590.0" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">An owner adds a teammate</text><text x="590.0" y="176" text-anchor="middle" font-size="12.5" fill="#5f6570">nobody asks for anything</text><rect x="764" y="130" width="372" height="86" rx="10" fill="#fdeef2" stroke="#d9537a" stroke-width="1.6"/><text x="950.0" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">A source finishes indexing</text><text x="950.0" y="176" text-anchor="middle" font-size="12.5" fill="#5f6570">the corpus changed</text><rect x="1124" y="130" width="372" height="86" rx="10" fill="#f4f5f7" stroke="#b9bfc9" stroke-width="1.6" stroke-dasharray="6 5"/><text x="1310.0" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Teams / Slack</text><text x="1310.0" y="176" text-anchor="middle" font-size="12.5" fill="#5f6570">message arrives in a channel</text><text x="44" y="258" text-anchor="start" font-size="12" font-weight="700" fill="#5f6570">2 — FASTAPI  ·  one container, one URL</text><rect x="44" y="270" width="1452" height="120" rx="14" fill="#eef2ff" stroke="#7c8ff5" stroke-width="1.6"/><rect x="64" y="290" width="344" height="82" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="236.0" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Auth</text><text x="236.0" y="336" text-anchor="middle" font-size="12.5" fill="#5f6570">JWT in an httpOnly cookie</text><text x="236.0" y="354" text-anchor="middle" font-size="12.5" fill="#5f6570">invite links, single-use</text><rect x="424" y="290" width="344" height="82" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="596.0" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Membership</text><text x="596.0" y="336" text-anchor="middle" font-size="12.5" fill="#5f6570">require_workspace / require_owner</text><text x="596.0" y="354" text-anchor="middle" font-size="12.5" fill="#5f6570">owner adds you, or you are not in</text><rect x="784" y="290" width="344" height="82" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="956.0" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Secrets</text><text x="956.0" y="336" text-anchor="middle" font-size="12.5" fill="#5f6570">Fernet at rest</text><text x="956.0" y="354" text-anchor="middle" font-size="12.5" fill="#5f6570">never returned by the API</text><rect x="1144" y="290" width="332" height="82" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="1310.0" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">REST  ·  /api/*</text><text x="1310.0" y="336" text-anchor="middle" font-size="12.5" fill="#5f6570">chat · briefs · gaps · answers</text><text x="1310.0" y="354" text-anchor="middle" font-size="12.5" fill="#5f6570">trust · activity · sources</text><text x="44" y="432" text-anchor="start" font-size="12" font-weight="700" fill="#38a36f">3 — WHAT THE AGENT DOES</text><rect x="44" y="444" width="724" height="286" rx="14" fill="#e7f7ef" stroke="#38a36f" stroke-width="1.6"/><rect x="64" y="468" width="336" height="116" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="232.0" y="493" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Answering  (asked)</text><text x="232.0" y="514" text-anchor="middle" font-size="12.5" fill="#5f6570">Strands agent loop picks tools</text><text x="232.0" y="532" text-anchor="middle" font-size="12.5" fill="#5f6570">search_project_docs</text><text x="232.0" y="550" text-anchor="middle" font-size="12.5" fill="#5f6570">list_project_knowledge</text><text x="232.0" y="568" text-anchor="middle" font-size="12.5" fill="#5f6570">streamed, every claim cited</text><rect x="416" y="468" width="332" height="116" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="582.0" y="493" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Onboarding brief  (unprompted)</text><text x="582.0" y="514" text-anchor="middle" font-size="12.5" fill="#5f6570">Graph: scout → facts → people</text><text x="582.0" y="532" text-anchor="middle" font-size="12.5" fill="#5f6570">structured_output → typed brief</text><text x="582.0" y="550" text-anchor="middle" font-size="12.5" fill="#5f6570">+ what the sources cannot answer</text><rect x="64" y="600" width="336" height="110" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="232.0" y="625" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Gap hunter  (unprompted)</text><text x="232.0" y="646" text-anchor="middle" font-size="12.5" fill="#5f6570">audits for what is ABSENT</text><text x="232.0" y="664" text-anchor="middle" font-size="12.5" fill="#5f6570">offers to draft what it can</text><text x="232.0" y="682" text-anchor="middle" font-size="12.5" fill="#5f6570">flags every inference</text><rect x="416" y="600" width="332" height="110" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="582.0" y="625" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Answer ledger</text><text x="582.0" y="646" text-anchor="middle" font-size="12.5" fill="#5f6570">ungrounded question recorded</text><text x="582.0" y="664" text-anchor="middle" font-size="12.5" fill="#5f6570">owner answers once</text><text x="582.0" y="682" text-anchor="middle" font-size="12.5" fill="#5f6570">indexed — known forever</text><text x="792" y="432" text-anchor="start" font-size="12" font-weight="700" fill="#8f71cf">4 — APPROVED SOURCES</text><rect x="792" y="444" width="704" height="286" rx="14" fill="#f3f0fb" stroke="#8f71cf" stroke-width="1.6"/><rect x="812" y="468" width="332" height="116" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="978.0" y="493" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Connected</text><text x="978.0" y="514" text-anchor="middle" font-size="12.5" fill="#5f6570">GitHub — 19 data types</text><text x="978.0" y="532" text-anchor="middle" font-size="12.5" fill="#5f6570">Confluence — one named space</text><text x="978.0" y="550" text-anchor="middle" font-size="12.5" fill="#5f6570">URLs · files (pdf, docx, md)</text><text x="978.0" y="568" text-anchor="middle" font-size="12.5" fill="#5f6570">credentials encrypted at rest</text><rect x="1160" y="468" width="316" height="116" rx="10" fill="#f4f5f7" stroke="#b9bfc9" stroke-width="1.6" stroke-dasharray="6 5"/><text x="1318.0" y="493" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Next</text><text x="1318.0" y="514" text-anchor="middle" font-size="12.5" fill="#5f6570">Jira · ServiceNow</text><text x="1318.0" y="532" text-anchor="middle" font-size="12.5" fill="#5f6570">Slack · SharePoint</text><text x="1318.0" y="550" text-anchor="middle" font-size="12.5" fill="#5f6570">scoped OAuth + ACL sync</text><rect x="812" y="600" width="664" height="110" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="1144.0" y="625" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Ingestion  ·  background</text><text x="1144.0" y="646" text-anchor="middle" font-size="12.5" fill="#5f6570">chunk 800 (the embedder truncates at 256 tokens — 2000 was half-invisible)</text><text x="1144.0" y="664" text-anchor="middle" font-size="12.5" fill="#5f6570">provenance header embedded, so a doc is findable by its own name</text><text x="1144.0" y="682" text-anchor="middle" font-size="12.5" fill="#5f6570">research cached per project, composed per person</text><text x="44" y="772" text-anchor="start" font-size="12" font-weight="700" fill="#d98c2b">5 — STATE</text><rect x="44" y="784" width="372" height="132" rx="10" fill="#fff4e6" stroke="#d98c2b" stroke-width="1.6"/><text x="230.0" y="809" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">MongoDB</text><text x="230.0" y="830" text-anchor="middle" font-size="12.5" fill="#5f6570">users · members · sources</text><text x="230.0" y="848" text-anchor="middle" font-size="12.5" fill="#5f6570">briefs · gap_reports · drafts</text><text x="230.0" y="866" text-anchor="middle" font-size="12.5" fill="#5f6570">unanswered · chat_sessions</text><rect x="404" y="784" width="372" height="132" rx="10" fill="#fff4e6" stroke="#d98c2b" stroke-width="1.6"/><text x="590.0" y="809" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">ChromaDB</text><text x="590.0" y="830" text-anchor="middle" font-size="12.5" fill="#5f6570">one collection per workspace</text><text x="590.0" y="848" text-anchor="middle" font-size="12.5" fill="#5f6570">chunk text + provenance</text><text x="590.0" y="866" text-anchor="middle" font-size="12.5" fill="#5f6570">+ answers the team gave</text><rect x="764" y="784" width="372" height="132" rx="10" fill="#fff4e6" stroke="#d98c2b" stroke-width="1.6"/><text x="950.0" y="809" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Model backend</text><text x="950.0" y="830" text-anchor="middle" font-size="12.5" fill="#5f6570">Bedrock · Groq · Ollama</text><text x="950.0" y="848" text-anchor="middle" font-size="12.5" fill="#5f6570">one LLM_BACKEND flag</text><text x="950.0" y="866" text-anchor="middle" font-size="12.5" fill="#5f6570">smaller model for background</text><rect x="1124" y="784" width="372" height="132" rx="10" fill="#fff4e6" stroke="#d98c2b" stroke-width="1.6"/><text x="1310.0" y="809" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">S3</text><text x="1310.0" y="830" text-anchor="middle" font-size="12.5" fill="#5f6570">S3SessionManager</text><text x="1310.0" y="848" text-anchor="middle" font-size="12.5" fill="#5f6570">conversation memory</text><rect x="44" y="958" width="1452" height="92" rx="12" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="68" y="986" text-anchor="start" font-size="11.5" font-weight="700" fill="#5f6570">WHAT IT NEVER DOES</text><text x="68" y="1012" text-anchor="start" font-size="13.5" font-weight="700" fill="#14161a">Reads outside these sources</text><text x="68" y="1032" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">every grant is listed, with its real ceiling</text><text x="432" y="1012" text-anchor="start" font-size="13.5" font-weight="700" fill="#14161a">Writes anywhere</text><text x="432" y="1032" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">every connector is read-only</text><text x="796" y="1012" text-anchor="start" font-size="13.5" font-weight="700" fill="#14161a">Answers a stranger</text><text x="796" y="1032" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">the owner&#x27;s list is the only way in</text><text x="1160" y="1012" text-anchor="start" font-size="13.5" font-weight="700" fill="#14161a">Stores a credential in the clear</text><text x="1160" y="1032" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">encrypted at rest; never returned by the API</text><path d="M230.0,216 V270" stroke="#c3c8d2" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M590.0,216 V270" stroke="#c3c8d2" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M950.0,216 V270" stroke="#c3c8d2" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M1310.0,216 V270" stroke="#c3c8d2" stroke-width="2.2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/><path d="M300,390 V444" stroke="#38a36f" stroke-width="2.2" fill="none" marker-end="url(#ag)"/><path d="M1100,390 V444" stroke="#8f71cf" stroke-width="2.2" fill="none" marker-end="url(#sr)"/><path d="M300,730 V757.0 H230 V784" stroke="#38a36f" stroke-width="2.2" fill="none" marker-end="url(#ag)"/><path d="M1100,730 V757.0 H590 V784" stroke="#8f71cf" stroke-width="2.2" fill="none" marker-end="url(#sr)"/><text x="240" y="748" text-anchor="start" font-size="11.5" font-weight="600" fill="#38a36f">reads + writes back</text><text x="700" y="748" text-anchor="start" font-size="11.5" font-weight="600" fill="#8f71cf">chunks + embeddings</text></svg>