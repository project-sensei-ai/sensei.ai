<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1090" viewBox="0 0 1480 1090" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c8d2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38a36f"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f71cf"/></marker></defs><rect width="1480" height="1090" fill="#fbfbfd"/><text x="44" y="52" font-size="28" font-weight="700" fill="#14161a">Sensei — a permission-aware project teammate</text><text x="44" y="79" text-anchor="start" font-size="14.5" font-weight="400" fill="#5f6570">Built on the Strands Agents SDK.   Solid = implemented today.   Dashed = next.</text><text x="44" y="120" text-anchor="start" font-size="12" font-weight="700" fill="#5f6570">1 — CHANNELS</text><rect x="44" y="132" width="448" height="98" rx="10" fill="#e9f4fb" stroke="#4b9ccb" stroke-width="1.6"/><text x="268.0" y="159" text-anchor="middle" font-size="16" font-weight="600" fill="#14161a">Web app  ·  React 19 SPA</text><text x="268.0" y="182" text-anchor="middle" font-size="13" fill="#5f6570">Owner onboards the agent · teammates ask</text><text x="268.0" y="201" text-anchor="middle" font-size="13" fill="#5f6570">served by FastAPI from the same origin</text><rect x="516" y="132" width="448" height="98" rx="10" fill="#f4f5f7" stroke="#b9bfc9" stroke-width="1.6" stroke-dasharray="6 5"/><text x="740.0" y="159" text-anchor="middle" font-size="16" font-weight="600" fill="#14161a">Microsoft Teams</text><text x="740.0" y="182" text-anchor="middle" font-size="13" fill="#5f6570">chat, and a named meeting participant</text><text x="740.0" y="201" text-anchor="middle" font-size="13" fill="#5f6570">Bot Framework adapter</text><rect x="988" y="132" width="448" height="98" rx="10" fill="#f4f5f7" stroke="#b9bfc9" stroke-width="1.6" stroke-dasharray="6 5"/><text x="1212.0" y="159" text-anchor="middle" font-size="16" font-weight="600" fill="#14161a">Slack</text><text x="1212.0" y="182" text-anchor="middle" font-size="13" fill="#5f6570">channel and DM answers</text><text x="1212.0" y="201" text-anchor="middle" font-size="13" fill="#5f6570">Bolt SDK adapter</text><text x="44" y="272" text-anchor="start" font-size="12" font-weight="700" fill="#7c8ff5">2 — FASTAPI APP</text><rect x="44" y="284" width="1392" height="132" rx="14" fill="#eef2ff" stroke="#7c8ff5" stroke-width="1.6"/><rect x="64" y="306" width="408" height="90" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="268.0" y="333" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Auth</text><text x="268.0" y="356" text-anchor="middle" font-size="13" fill="#5f6570">JWT in an httpOnly cookie</text><text x="268.0" y="375" text-anchor="middle" font-size="13" fill="#5f6570">email + password, or Google ID token</text><rect x="536" y="306" width="408" height="90" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="740.0" y="333" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Membership  ·  db/membership.py</text><text x="740.0" y="356" text-anchor="middle" font-size="13" fill="#5f6570">require_workspace() · require_owner()</text><text x="740.0" y="375" text-anchor="middle" font-size="13" fill="#5f6570">owners write · members read</text><rect x="1008" y="306" width="408" height="90" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="1212.0" y="333" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">REST API  ·  /api/*</text><text x="1212.0" y="356" text-anchor="middle" font-size="13" fill="#5f6570">/auth /workspaces (+join) /sources /ingest /chat</text><text x="1212.0" y="375" text-anchor="middle" font-size="13" fill="#5f6570">one container · one URL · no CORS</text><text x="44" y="456" text-anchor="start" font-size="12" font-weight="700" fill="#8f71cf">3a — WRITE PATH</text><rect x="44" y="468" width="700" height="282" rx="14" fill="#f3f0fb" stroke="#8f71cf" stroke-width="1.6"/><rect x="64" y="496" width="320" height="124" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="224.0" y="523" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Approved sources</text><text x="224.0" y="546" text-anchor="middle" font-size="13" fill="#5f6570">GitHub — 19 data types</text><text x="224.0" y="565" text-anchor="middle" font-size="13" fill="#5f6570">Confluence — spaces and pages</text><text x="224.0" y="584" text-anchor="middle" font-size="13" fill="#5f6570">URLs — pre-validated crawl</text><text x="224.0" y="603" text-anchor="middle" font-size="13" fill="#5f6570">Files — pdf, docx, md, txt</text><rect x="404" y="496" width="320" height="124" rx="10" fill="#f4f5f7" stroke="#b9bfc9" stroke-width="1.6" stroke-dasharray="6 5"/><text x="564.0" y="523" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Next</text><text x="564.0" y="546" text-anchor="middle" font-size="13" fill="#5f6570">Jira · ServiceNow · SharePoint</text><text x="564.0" y="565" text-anchor="middle" font-size="13" fill="#5f6570">Slack · Azure DevOps</text><text x="564.0" y="584" text-anchor="middle" font-size="13" fill="#5f6570"></text><text x="564.0" y="603" text-anchor="middle" font-size="13" fill="#5f6570">scoped OAuth + per-item ACL sync</text><rect x="64" y="638" width="660" height="94" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="394.0" y="665" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Ingestion  ·  BackgroundTask</text><text x="394.0" y="688" text-anchor="middle" font-size="13" fill="#5f6570">fetch_github · fetch_confluence · fetch_urls · parse_file</text><text x="394.0" y="707" text-anchor="middle" font-size="13" fill="#5f6570">chunk 2 000 / overlap 200  →  embed all-MiniLM-L6-v2  →  upsert</text><text x="768" y="456" text-anchor="start" font-size="12" font-weight="700" fill="#38a36f">3b — READ PATH</text><rect x="768" y="468" width="668" height="282" rx="14" fill="#e7f7ef" stroke="#38a36f" stroke-width="1.6"/><rect x="788" y="496" width="628" height="62" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="1102.0" y="523" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Strands Agent loop</text><text x="1102.0" y="546" text-anchor="middle" font-size="13" fill="#5f6570">the agent picks its tools, then synthesises an answer with citations</text><rect x="788" y="578" width="304" height="154" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="940.0" y="605" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Tools  ( @tool )</text><text x="940.0" y="628" text-anchor="middle" font-size="13" fill="#5f6570">search_project_docs        ✓</text><text x="940.0" y="647" text-anchor="middle" font-size="13" fill="#5f6570">search_knowledge_base   ✓</text><text x="940.0" y="666" text-anchor="middle" font-size="13" fill="#5f6570">get_issue · get_incident</text><text x="940.0" y="685" text-anchor="middle" font-size="13" fill="#5f6570">resolve_person · who_owns</text><text x="940.0" y="704" text-anchor="middle" font-size="13" fill="#5f6570">person_activity</text><rect x="1112" y="578" width="304" height="154" rx="10" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="1264.0" y="605" text-anchor="middle" font-size="15" font-weight="600" fill="#14161a">Model backend</text><text x="1264.0" y="628" text-anchor="middle" font-size="13" fill="#5f6570">Bedrock   — production</text><text x="1264.0" y="647" text-anchor="middle" font-size="13" fill="#5f6570">Groq         — development</text><text x="1264.0" y="666" text-anchor="middle" font-size="13" fill="#5f6570">Ollama     — offline</text><text x="1264.0" y="685" text-anchor="middle" font-size="13" fill="#5f6570"></text><text x="1264.0" y="704" text-anchor="middle" font-size="13" fill="#5f6570">one flag: LLM_BACKEND</text><text x="44" y="792" text-anchor="start" font-size="12" font-weight="700" fill="#d98c2b">4 — STATE</text><rect x="44" y="804" width="448" height="150" rx="10" fill="#fff4e6" stroke="#d98c2b" stroke-width="1.6"/><text x="268.0" y="831" text-anchor="middle" font-size="16" font-weight="600" fill="#14161a">MongoDB</text><text x="268.0" y="854" text-anchor="middle" font-size="13" fill="#5f6570">users · workspaces · members</text><text x="268.0" y="873" text-anchor="middle" font-size="13" fill="#5f6570">sources · invites · chat_sessions</text><text x="268.0" y="892" text-anchor="middle" font-size="13" fill="#5f6570"></text><text x="268.0" y="911" text-anchor="middle" font-size="13" fill="#5f6570">records, roles and audit trail</text><rect x="516" y="804" width="448" height="150" rx="10" fill="#fff4e6" stroke="#d98c2b" stroke-width="1.6"/><text x="740.0" y="831" text-anchor="middle" font-size="16" font-weight="600" fill="#14161a">ChromaDB</text><text x="740.0" y="854" text-anchor="middle" font-size="13" fill="#5f6570">one collection per workspace</text><text x="740.0" y="873" text-anchor="middle" font-size="13" fill="#5f6570">ws_{workspace_id}</text><text x="740.0" y="892" text-anchor="middle" font-size="13" fill="#5f6570"></text><text x="740.0" y="911" text-anchor="middle" font-size="13" fill="#5f6570">chunk text + source metadata</text><rect x="988" y="804" width="448" height="150" rx="10" fill="#fff4e6" stroke="#d98c2b" stroke-width="1.6"/><text x="1212.0" y="831" text-anchor="middle" font-size="16" font-weight="600" fill="#14161a">S3</text><text x="1212.0" y="854" text-anchor="middle" font-size="13" fill="#5f6570">S3SessionManager</text><text x="1212.0" y="873" text-anchor="middle" font-size="13" fill="#5f6570">agent conversation memory</text><text x="1212.0" y="892" text-anchor="middle" font-size="13" fill="#5f6570"></text><text x="1212.0" y="911" text-anchor="middle" font-size="13" fill="#5f6570">one session per chat thread</text><rect x="44" y="986" width="1392" height="86" rx="12" fill="#fff" stroke="#c3c8d2" stroke-width="1.6"/><text x="68" y="1014" text-anchor="start" font-size="14" font-weight="700" fill="#14161a">Scoped</text><text x="68" y="1034" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">the owner picks the exact repos, spaces</text><text x="68" y="1050" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">and URLs — nothing else is read</text><text x="416" y="1014" text-anchor="start" font-size="14" font-weight="700" fill="#14161a">Grounded</text><text x="416" y="1034" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">project claims come only from indexed</text><text x="416" y="1050" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">passages, each cited inline</text><text x="764" y="1014" text-anchor="start" font-size="14" font-weight="700" fill="#14161a">Separated</text><text x="764" y="1034" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">owners manage sources; members read and</text><text x="764" y="1050" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">ask; chats stay private</text><text x="1112" y="1014" text-anchor="start" font-size="14" font-weight="700" fill="#14161a">Revocable</text><text x="1112" y="1034" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">delete a source and its vectors go with</text><text x="1112" y="1050" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6570">it; invites expire in 7 days</text><path d="M268.0,230 V284" stroke="#c3c8d2" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M740.0,230 V284" stroke="#c3c8d2" stroke-width="2.2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/><path d="M1212.0,230 V284" stroke="#c3c8d2" stroke-width="2.2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/><path d="M394,416 V468" stroke="#8f71cf" stroke-width="2.2" fill="none" marker-end="url(#sr)"/><path d="M1102,416 V468" stroke="#38a36f" stroke-width="2.2" fill="none" marker-end="url(#ag)"/><path d="M394,750 V777.0 H640 V804" stroke="#8f71cf" stroke-width="2.2" fill="none" marker-end="url(#sr)"/><text x="408" y="770" text-anchor="start" font-size="12.5" font-weight="600" fill="#8f71cf">upsert chunks</text><path d="M1102,750 V777.0 H820 V804" stroke="#38a36f" stroke-width="2.2" fill="none" marker-end="url(#ag)"/><text x="1088" y="770" text-anchor="end" font-size="12.5" font-weight="600" fill="#38a36f">retrieve + cite</text></svg>